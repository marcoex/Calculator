name: Build VisualClick APK
on:
  push:
    branches:
      - chatgpt-visualclick-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract source
        run: unzip -q VisualClickJS-source.zip
      - name: Build debug APK
        working-directory: VisualClickJS
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp VisualClickJS/app/build/outputs/apk/debug/app-debug.apk VisualClickJS-0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VisualClickJS-APK
          path: VisualClickJS-0.1-debug.apk
