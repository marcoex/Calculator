name: Build VisualClick APK
on:
  push:
    branches:
      - chatgpt-visualclick-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Rebuild source archive
        run: |
          cat vcparts/00.txt vcparts/01.txt vcparts/02.txt vcparts/03.txt | base64 -d > VisualClickJS-source-fixed.zip
          unzip -t VisualClickJS-source-fixed.zip
          unzip -q VisualClickJS-source-fixed.zip
      - name: Build debug APK
        working-directory: VisualClickJS
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp VisualClickJS/app/build/outputs/apk/debug/app-debug.apk VisualClickJS-0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VisualClickJS-APK
          path: VisualClickJS-0.1-debug.apk
